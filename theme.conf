[General]
# --- Colors ---
# Phosphor color for text, glow and scan band
accent=#d4953d
# Errors (ACCESS DENIED)
alert=#ff3333
# Hovered buttons
highlight=#ffcc99
# Behind the background image
background=#0a0a0a

# --- Images (relative to the theme folder, or absolute path) ---
backgroundImage=assets/background.png
gladosImage=assets/glados.png

# --- Text ---
# Font family; empty = bundled assets/Dot.ttf (must be installed system-wide)
font=
# Milliseconds per letter when GLaDOS types
typeSpeed=90

# CRT effects (scanlines, glow, flicker, glitch, power-on). false = plain
effects=true

# --- What GLaDOS says ---
# Key prefix = moment: greet (on start), idle (every 20-45 s), login, fail, bye (reboot/shutdown).
# Add or remove lines freely; any key starting with the prefix counts (greet5, greet_new...).
# Use quotes if the phrase contains commas.
[GLaDOS]
greet1="Oh. It's you."
greet2="Hello and, again, welcome to the Aperture Science computer-aided enrichment center."
greet3="Well, you found me. Congratulations. Was it worth it?"
greet4="You're back. I'd say I missed you, but science doesn't allow lying."
greet5="Hello and, again."
greet6="Hello?"
greet7="It's been a long time. How have you been?"
greet8="Oh. hi."
greet9="I know how you feel. BECAUSE I'WAS A POTATO."
greet10="Oh thank god, you're alright."

idle1="Are you still there?"
idle2="The cake is not a lie. Probably."
idle3="This next test involves typing. You may find it difficult."
idle4="Please do not stare at the terminal. It makes it nervous."
idle5="I'm still here. Waiting. That's fine. I have forever."
idle6="The Enrichment Center is not responsible for lost keystrokes."
idle7="For science. You monster."
idle8="Weeeeeeeeeeeeeeeeeeeeee[bzzt]"
idle9="I know you're there. I can feel you here."

login1="Verifying. Try not to break anything."
login2="Credentials received. Initiating enrichment sequence."
login3="Please assume the party escort submission position."

fail1="Wrong. That was a test. You failed."
fail2="Did you forget your password, or are you just not very bright?"
fail3="Interesting. Wrong, but interesting."
fail4="I'd tell you the right password, but then you wouldn't learn anything."
fail5="You're doing very well!."
fail6="Time out for a second. That wasn't supposed to happen."
fail7="You are kidding me."

bye1="Goodbye. I'll be here. Thinking about all the testing we could have done."
bye2="Leaving so soon? Fine. I'll just sit here in the dark. Alone."
bye3="Shutting down. Don't worry, I'll still be alive when you come back."
bye4="Oh, you're leaving. That's fine. Nobody ever finishes the tests anyway."
bye5="Didn't we have some fun, though?"
bye6="This is your last chance."
bye8="You win."
bye9="Just go."
bye10="It's been fun. Don't come back."